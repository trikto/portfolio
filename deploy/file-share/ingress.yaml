# Public surface: host api.gajan.dev, paths Prefix /api/v1/files and
# /api/v1/ideamart (charging notification). Health and metrics stay cluster-local.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: file-share
  namespace: files
  labels:
    app.kubernetes.io/name: file-share
    app.kubernetes.io/part-of: file-share
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.gajan.dev
      secretName: gajan-dev-tls
  rules:
    - host: api.gajan.dev
      http:
        paths:
          - path: /api/v1/files
            pathType: Prefix
            backend:
              service:
                name: file-share
                port:
                  name: http
          - path: /api/v1/ideamart
            pathType: Prefix
            backend:
              service:
                name: file-share
                port:
                  name: http
