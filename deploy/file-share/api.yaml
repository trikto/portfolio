apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-share
  namespace: files
  labels:
    app.kubernetes.io/name: file-share
    app.kubernetes.io/part-of: file-share
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: file-share
  template:
    metadata:
      labels:
        app.kubernetes.io/name: file-share
        app.kubernetes.io/part-of: file-share
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/trikto/portfolio/file-share:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            - name: PORT
              value: "8080"
            - name: METRICS_PORT
              value: "9090"
            - name: DATA_DIR
              value: "/data"
            - name: ALLOWED_ORIGINS
              value: "https://gajan.dev"
            - name: MAX_PAYLOAD_BYTES
              value: "104858014"
            - name: RATE_LIMIT_PER_HOUR
              value: "20"
            - name: LOG_LEVEL
              value: "info"
            - name: FILE_SHARE_PAYWALL
              value: "true"
            - name: FILE_SHARE_PRICE
              value: "5"
            - name: FILE_SHARE_CURRENCY
              value: "LKR"
          envFrom:
            - secretRef:
                name: file-share-ideamart
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: file-share-data
---
apiVersion: v1
kind: Service
metadata:
  name: file-share
  namespace: files
  labels:
    app.kubernetes.io/name: file-share
    app.kubernetes.io/part-of: file-share
spec:
  selector:
    app.kubernetes.io/name: file-share
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
