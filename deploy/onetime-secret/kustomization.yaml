apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - valkey.yaml
  - api.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  - grafana-dashboard.yaml

# Avoid commonLabels: it stamps managed-by onto NetworkPolicy from.podSelector
# and blocks Traefik. Keep it on Deployment/Service selectors (immutable).
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
    fields:
      - kind: Service
        path: spec/selector
        create: true
      - kind: Deployment
        path: spec/selector/matchLabels
        create: true
      - kind: Deployment
        path: spec/template/metadata/labels
        create: true
