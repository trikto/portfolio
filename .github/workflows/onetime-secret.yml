name: onetime-secret

on:
  push:
    branches: [main]
    paths:
      - "services/onetime-secret/**"
      - ".github/workflows/onetime-secret.yml"
  pull_request:
    paths:
      - "services/onetime-secret/**"
      - ".github/workflows/onetime-secret.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/trikto/portfolio/onetime-secret
  GO_VERSION: "1.23"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/onetime-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/onetime-secret/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: CGO_ENABLED=0 go build -o /tmp/onetime-secret ./cmd/server

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/onetime-secret
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
